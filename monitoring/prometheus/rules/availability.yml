groups:
  - name: service_availability
    rules:
      - alert: ServiceHttpDown
        expr: |
          (probe_success{job="http"} == 0)
          and on(job, instance, host)
          (up{job="http"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint HTTP trên {{ $labels.host }} không đạt kiểm tra"
          description: "{{ $labels.instance }} thất bại liên tục ít nhất 1 phút; Prometheus vẫn thu được kết quả probe."
          action: "Kiểm tra Nginx, log container, cổng trong URL instance và đường mạng từ VM1 tới host đích."
