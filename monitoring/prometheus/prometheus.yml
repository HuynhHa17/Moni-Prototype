global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          host: monitoring-vm1
          environment: lab
          site: onprem-lab
          rack: rack-01
          team: infra

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          host: monitoring-vm1
          environment: lab
          site: onprem-lab
          rack: rack-01
          team: infra

  - job_name: webhook
    metrics_path: /metrics
    static_configs:
      - targets:
          - webhook:8080
        labels:
          host: monitoring-vm1
          environment: lab
          site: onprem-lab
          rack: rack-01
          team: infra
          target_id: webhook-monitoring-vm1

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: monitoring-vm1
          environment: lab
          site: onprem-lab
          rack: rack-01
          team: infra
          target_id: node-monitoring-vm1
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node.json
        refresh_interval: 15s

  - job_name: cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor.json
        refresh_interval: 15s
    metric_relabel_configs:
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox:9115
        labels:
          host: monitoring-vm1
          environment: lab
          site: onprem-lab
          rack: rack-01
          team: infra

  - job_name: http
    metrics_path: /probe
    params:
      module:
        - http_workload
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/http.json
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/targets/*.rules.yml
