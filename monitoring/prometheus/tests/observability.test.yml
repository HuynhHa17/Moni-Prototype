rule_files:
  - ../rules/observability.yml
  - ../rules/availability.yml
evaluation_interval: 15s
tests:
  - name: Unreachable node exporter fires ExporterDown only for that target
    interval: 15s
    input_series:
      - series: 'up{job="node",instance="alpha:9100",host="alpha",environment="lab"}'
        values: '0x12'
      - series: 'up{job="node",instance="beta:9100",host="beta",environment="lab"}'
        values: '1x12'
      - series: 'up{job="blackbox-exporter",instance="blackbox:9115"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 30s
        alertname: ExporterDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: alpha:9100
              host: alpha
              environment: lab
            exp_annotations:
              summary: "Prometheus không thu thập được node tại alpha:9100"
              description: "up = 0 liên tục ít nhất 1 phút. Số liệu của target này không còn cập nhật nên trạng thái là chưa xác định; không phải bằng chứng host đã tắt hay dịch vụ vẫn ổn."
              action: "Kiểm tra container exporter (docker compose ps), cổng trong instance và đường mạng từ VM1; xem panel Thu thập trên dashboard Host."
              dashboard: "/d/moni-vm2/?var-host=alpha"
              runbook: "docs/alerts.md#exporterdown"

  - name: Failed probe scrape is unknown, not HTTP down
    interval: 15s
    input_series:
      - series: 'up{job="http",instance="http://alpha:8080/health",host="alpha",environment="lab"}'
        values: '0x12'
      - series: 'probe_success{job="http",instance="http://alpha:8080/health",host="alpha",environment="lab"}'
        values: '0x12'
    alert_rule_test:
      - eval_time: 2m
        alertname: ProbeScrapeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: http
              instance: http://alpha:8080/health
              host: alpha
              environment: lab
            exp_annotations:
              summary: "Không lấy được kết quả kiểm tra HTTP http://alpha:8080/health trên alpha"
              description: "Prometheus không scrape được Blackbox cho probe này liên tục ít nhất 1 phút. Trạng thái HTTP là chưa xác định, không phải HTTP lỗi hay HTTP đạt; ServiceHttpDown không đánh giá khi mất probe."
              action: "Kiểm tra container blackbox trên VM1 và log của nó; nếu ExporterDown của blackbox-exporter cũng firing thì xử lý Blackbox trước."
              dashboard: "/d/moni-vm2/?var-host=alpha"
              runbook: "docs/alerts.md#probescrapefailed"
      - eval_time: 2m
        alertname: ServiceHttpDown
        exp_alerts: []

  - name: Target that disappears from discovery fires TargetMissing even with sibling target on same host
    interval: 15s
    input_series:
      - series: 'moni:target_expected{job="http",host="alpha",environment="lab",target_id="http-alpha-nginx"}'
        values: '1x20'
      - series: 'moni:target_expected{job="http",host="alpha",environment="lab",target_id="http-alpha-podinfo"}'
        values: '1x20'
      - series: 'up{job="http",instance="http://alpha:8080/health",host="alpha",environment="lab",target_id="http-alpha-nginx"}'
        values: '1x20'
      - series: 'up{job="http",instance="http://alpha:8080/app/healthz",host="alpha",environment="lab",target_id="http-alpha-podinfo"}'
        values: '1x4 stale'
    alert_rule_test:
      - eval_time: 1m
        alertname: TargetMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: TargetMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: http
              host: alpha
              environment: lab
              target_id: http-alpha-podinfo
            exp_annotations:
              summary: "Target http (http-alpha-podinfo) của alpha không còn trong Prometheus"
              description: "Inventory kỳ vọng có target này nhưng Prometheus không còn series up (mất khỏi service discovery hoặc bị relabel loại). Không có dữ liệu để đánh giá; các cảnh báo khác của target có thể đã hết firing vì thiếu dữ liệu."
              action: "Chạy lại scripts/render_targets.py, kiểm tra .runtime/prometheus/targets và trang Targets của Prometheus; ExporterDown không thay được cảnh báo này."
              dashboard: "/d/moni-vm2/?var-host=alpha"
              runbook: "docs/alerts.md#targetmissing"
      - eval_time: 5m
        alertname: ExporterDown
        exp_alerts: []

  - name: Present targets do not fire coverage alerts
    interval: 15s
    input_series:
      - series: 'moni:target_expected{job="http",host="alpha",environment="lab",target_id="http-alpha-nginx"}'
        values: '1x20'
      - series: 'up{job="http",instance="http://alpha:8080/health",host="alpha",environment="lab",target_id="http-alpha-nginx"}'
        values: '1x20'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"ExporterDown|ProbeScrapeFailed|TargetMissing"}'
        eval_time: 5m
        exp_samples: []

  - name: Monitoring self-health rules fire on reload failure and notification failure
    interval: 15s
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="localhost:9090"}'
        values: '0x12'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="alertmanager:9093",integration="webhook"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 3m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus
              instance: localhost:9090
            exp_annotations:
              summary: "Prometheus tải lại cấu hình thất bại trên localhost:9090"
              description: "prometheus_config_last_reload_successful = 0 liên tục ít nhất 1 phút. Cấu hình hoặc file rule mới có lỗi cú pháp và chưa được áp dụng."
              action: "Chạy promtool check config và promtool check rules, xem log container prometheus trên VM1 để sửa lỗi cú pháp."
              dashboard: "/d/moni-vm2/?var-host=monitoring-vm1"
              runbook: "docs/alerts.md#prometheusconfigreloadfailed"
      - eval_time: 3m
        alertname: AlertmanagerNotificationFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: alertmanager
              instance: alertmanager:9093
              integration: webhook
            exp_annotations:
              summary: "Alertmanager gửi thông báo thất bại tới webhook"
              description: "Có 12 lượt gửi cảnh báo thất bại trong 5 phút gần nhất tới kênh webhook. Người trực hoặc kho lịch sử có thể bỏ lỡ sự cố."
              action: "Kiểm tra log container alertmanager, sức khỏe container webhook (/health) hoặc token/mạng ra kênh Telegram."
              dashboard: "/d/moni-vm2/?var-host=monitoring-vm1"
              runbook: "docs/alerts.md#alertmanagernotificationfailed"
