groups:
  - name: service_availability
    rules:
      - alert: ServiceHttpDown
        expr: |
          (probe_success{job="http"} == 0)
          and on(job, instance, host)
          (up{job="http"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dịch vụ {{ $labels.service }} trên {{ $labels.host }} không đạt kiểm tra HTTP"
          description: "Kiểm tra {{ $labels.instance }} thất bại liên tục ít nhất 1 phút trong khi Prometheus vẫn thu được kết quả probe (up = 1). Người dùng gọi endpoint này có thể đang nhận lỗi; nguyên nhân chưa xác định."
          action: "Kiểm tra Nginx, log container, cổng trong URL instance và đường mạng từ VM1 tới host đích."
          dashboard: "/d/moni-vm2/?var-host={{ $labels.host }}"
          runbook: "docs/alerts.md#servicehttpdown"
