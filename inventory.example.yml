# Copy to inventory.yml at the repository root (gitignored) and fill in lab IPs.
# Never commit real lab IPs, tokens or passwords to Git.
# Reference: ADR-04.1 (docs/architecture-decision.md).

environment: lab

defaults:
  site: onprem-lab
  rack: rack-01
  team: infra

hosts:
  - host: workload-vm2
    address: CHANGE_ME
    site: onprem-lab
    rack: rack-01
    team: app
    profiles: [node, http, cadvisor]
    node_port: 9100
    cadvisor_port: 8081
    http_probes:
      - service: moni-nginx
        port: 8080
        path: /health

  # Phase B (uncomment when expanding to VM Cloud and simulated DC):
