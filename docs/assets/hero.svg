<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" width="1200" height="248" role="img" aria-label="Moni-Prototype — Multi-Layer Infrastructure Observability">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowRight" cx="82%" cy="30%" r="48%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="10%" cy="15%" r="36%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="waveArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.35"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pulse-ring { transform-origin: 797px 56px; animation: pulseRing 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      .line-draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: drawLine 2.2s ease-out forwards; }
      .fade-up { opacity: 0; animation: fadeUp 0.7s ease-out forwards 0.2s; }
      @keyframes pulseRing {
        0% { transform: scale(1); opacity: 0.75; }
        70% { transform: scale(2.3); opacity: 0; }
        100% { transform: scale(2.3); opacity: 0; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect x="1" y="1" width="1198" height="246" rx="14" fill="url(#heroBg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="244" rx="13" fill="url(#dotGrid)"/>
  <rect x="2" y="2" width="1196" height="244" rx="13" fill="url(#glowRight)"/>
  <rect x="2" y="2" width="1196" height="244" rx="13" fill="url(#glowLeft)"/>

  <!-- Subtle top highlight line -->
  <line x1="24" y1="2" x2="1176" y2="2" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Left Brand & Typography -->
  <g class="fade-up">
    <!-- Brand Mark -->
    <rect x="48" y="42" width="52" height="52" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="58" y="70" width="6" height="14" rx="2" fill="#38bdf8" fill-opacity="0.55"/>
    <rect x="68" y="62" width="6" height="22" rx="2" fill="#38bdf8" fill-opacity="0.85"/>
    <rect x="78" y="53" width="6" height="31" rx="2" fill="#10b981"/>
    <circle cx="88" cy="54" r="3.5" fill="#10b981"/>

    <!-- Eyebrow & Title -->
    <text x="116" y="58" class="mono" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="2.1">MULTI-LAYER OBSERVABILITY &amp; SRE ALERTING STACK</text>
    <text x="116" y="96" class="sans" font-size="38" font-weight="700" fill="#f8fafc" letter-spacing="-0.8">Moni-Prototype</text>

    <!-- Subtitle -->
    <text x="48" y="136" class="sans" font-size="16" fill="#cbd5e1">Multi-layer infrastructure monitoring &amp; SRE alerting for Linux hosts, containers, Cloud and Data Center.</text>
    <text x="48" y="159" class="sans" font-size="13.5" fill="#64748b">Deterministic PromQL rules · PostgreSQL 16 incident lifecycle · Self-monitoring · GitOps CI verified</text>

    <!-- Clean Minimal Spec Pills -->
    <g transform="translate(48, 184)">
      <rect x="0" y="0" width="124" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="14" cy="14" r="3.5" fill="#e6522c"/>
      <text x="26" y="18" class="mono" font-size="11.5" fill="#e2e8f0">Prometheus 3.5</text>

      <rect x="134" y="0" width="108" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="148" cy="14" r="3.5" fill="#f46800"/>
      <text x="160" y="18" class="mono" font-size="11.5" fill="#e2e8f0">Grafana 12.3</text>

      <rect x="252" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="266" cy="14" r="3.5" fill="#a855f7"/>
      <text x="278" y="18" class="mono" font-size="11.5" fill="#e2e8f0">Alertmanager 0.28</text>

      <rect x="402" y="0" width="122" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="416" cy="14" r="3.5" fill="#38bdf8"/>
      <text x="428" y="18" class="mono" font-size="11.5" fill="#e2e8f0">PostgreSQL 16</text>

      <rect x="534" y="0" width="114" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="548" cy="14" r="3.5" fill="#10b981"/>
      <text x="560" y="18" class="mono" font-size="11.5" fill="#e2e8f0">65 Tests Pass</text>
    </g>
  </g>

  <!-- Right Live Telemetry Card -->
  <g>
    <rect x="772" y="34" width="380" height="180" rx="12" fill="#0b1120" fill-opacity="0.92" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Card Header -->
    <circle cx="797" cy="56" r="4.5" fill="#10b981" fill-opacity="0.35" class="pulse-ring"/>
    <circle cx="797" cy="56" r="4" fill="#10b981"/>
    <text x="810" y="60" class="mono" font-size="11" font-weight="600" fill="#e2e8f0" letter-spacing="0.8">TELEMETRY PIPELINE</text>
    <text x="1132" y="60" text-anchor="end" class="mono" font-size="10.5" fill="#64748b">15s scrape</text>
    <line x1="788" y1="72" x2="1136" y2="72" stroke="#1e293b" stroke-width="1"/>

    <!-- Mini Grid Lines -->
    <line x1="788" y1="98" x2="1136" y2="98" stroke="#1e293b" stroke-dasharray="3 4" stroke-width="1"/>
    <line x1="788" y1="126" x2="1136" y2="126" stroke="#1e293b" stroke-dasharray="3 4" stroke-width="1"/>
    <line x1="788" y1="154" x2="1136" y2="154" stroke="#1e293b" stroke-width="1"/>

    <!-- Animated Sparkline Area & Curve -->
    <path d="M788,140 C816,138 830,118 858,122 C886,126 902,135 928,112 C954,89 972,118 1000,116 C1028,114 1044,96 1072,102 C1098,108 1114,92 1134,90 L1134,154 L788,154 Z" fill="url(#waveArea)"/>
    <path d="M788,140 C816,138 830,118 858,122 C886,126 902,135 928,112 C954,89 972,118 1000,116 C1028,114 1044,96 1072,102 C1098,108 1114,92 1134,90" fill="none" stroke="url(#waveStroke)" stroke-width="2.4" stroke-linecap="round" class="line-draw"/>
    <circle cx="1134" cy="90" r="3.8" fill="#10b981"/>
    <circle cx="1134" cy="90" r="8" fill="#10b981" fill-opacity="0.22"/>

    <!-- Card Bottom Stats -->
    <g transform="translate(788, 174)">
      <text x="0" y="0" class="mono" font-size="9.5" fill="#64748b">RETENTION</text>
      <text x="0" y="18" class="mono" font-size="12" font-weight="600" fill="#f8fafc">60d / 5GB</text>

      <text x="118" y="0" class="mono" font-size="9.5" fill="#64748b">ALERT LAYERS</text>
      <text x="118" y="18" class="mono" font-size="12" font-weight="600" fill="#38bdf8">4-Tier SRE</text>

      <text x="242" y="0" class="mono" font-size="9.5" fill="#64748b">HISTORY DB</text>
      <text x="242" y="18" class="mono" font-size="12" font-weight="600" fill="#10b981">PG 16 ACID</text>
    </g>
  </g>
</svg>

